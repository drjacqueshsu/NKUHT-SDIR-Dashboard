<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Noto Sans TC",sans-serif;background:#F7F4EA;color:#1F2A24;font-size:14px;}
:root{--g:#0a5a2e;--dg:#08471f;--gd:#c8a64b;--lg:#e8f1eb;--br:#e3decf;}
.hdr{background:var(--dg);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--gd);}

.fbar{background:#fff;border-bottom:1px solid var(--br);padding:8px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.fbar label{font-size:12px;color:#888;}
.fbar select{font-size:12px;padding:5px 8px;border:1px solid var(--br);border-radius:5px;background:#fff;color:#1F2A24;cursor:pointer;}
.tabs{display:flex;background:var(--lg);border-bottom:2px solid var(--br);padding:0 24px;}
.tab{padding:10px 18px;font-size:13px;color:#666;cursor:pointer;background:none;border:none;border-bottom:3px solid transparent;}
.tab.on{font-weight:700;color:var(--g);border-bottom:3px solid var(--gd);}
.pg{display:none;padding:18px 24px;}
.pg.on{display:block;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.kpi{background:#fff;border:1px solid var(--br);border-radius:10px;padding:13px 16px;border-top:3px solid var(--gd);}
.kpi .lb{font-size:10px;color:#999;margin-bottom:5px;}
.kpi .nm{font-size:13px;font-weight:700;color:var(--g);line-height:1.3;}
.kpi .vl{font-size:28px;font-weight:700;color:var(--gd);margin-top:4px;}
.card{background:#fff;border:1px solid var(--br);border-radius:10px;padding:16px;margin-bottom:14px;overflow:hidden;}
.ct{font-size:12px;font-weight:700;color:var(--dg);margin-bottom:12px;border-left:3px solid var(--gd);padding-left:8px;}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
.leg span{display:flex;align-items:center;gap:5px;font-size:11px;}
.leg i{width:11px;height:11px;border-radius:2px;display:inline-block;flex-shrink:0;}
canvas{display:block;width:100%!important;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:var(--dg);color:#fff;padding:7px 10px;text-align:left;cursor:pointer;position:sticky;top:0;font-size:11px;white-space:nowrap;}
tbody tr:nth-child(even){background:var(--lg);}
tbody td{padding:6px 10px;border-bottom:1px solid var(--br);}
</style>
</head>

// ══ 狀態 ══
let curCol="全部", curDep="全部", curGrd="全部", sortK="avgPR", sortA=false;
const charts={};

function deptsFor(col){
  if(col==="全部") return Object.keys(DEP);
  return Object.keys(DEP).filter(d=>DEP[d].col===col);
}

// 取得當前篩選的 PR 陣列
function activePR(){
  if(curDep!=="全部"){
    if(curGrd!=="全部") return DEP_GRD[curDep][curGrd];
    return DEP[curDep].pr;
  }
  if(curCol!=="全部"){
    if(curGrd!=="全部") return COL_GRD[curCol][curGrd];
    return COL[curCol];
  }
  if(curGrd!=="全部") return GRD[curGrd];
  return OVERALL;
}

function avgArr(a){const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?+(v.reduce((s,x)=>s+x,0)/v.length).toFixed(1):0;}

function updateHint(){
  let t=curDep!=="全部"?curDep:curCol!=="全部"?curCol:"全校";
  if(curGrd!=="全部") t+=` · ${curGrd}`;
  document.getElementById("hint").textContent=t;
}

// ══ 篩選器事件 ══
function onCol(){
  curCol=document.getElementById("selCol").value;
  curDep="全部";
  const ds=document.getElementById("selDep");
  ds.innerHTML='<option>全部</option>';
  deptsFor(curCol).sort().forEach(d=>{const o=document.createElement("option");o.text=d;ds.add(o);});
  updateHint(); refresh();
}
function onDep(){curDep=document.getElementById("selDep").value; updateHint(); refresh();}
function onGrd(){curGrd=document.getElementById("selGrd").value; updateHint(); refresh();}

function refresh(){
  const ci=[...document.querySelectorAll(".tab")].findIndex(t=>t.classList.contains("on"));
  [drawP0,drawP1,drawP2][ci]&&[drawP0,drawP1,drawP2][ci]();
}

// ══ 頁籤 ══
function gTab(i){
  document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("on",i===j));
  document.querySelectorAll(".pg").forEach((p,j)=>p.classList.toggle("on",i===j));
  [drawP0,drawP1,drawP2][i]();
}

// ══ 圖表工廠 ══
function mk(id,type,data,opts){
  if(charts[id]){charts[id].destroy();delete charts[id];}
  const c=document.getElementById(id);
  if(!c) return;
  charts[id]=new Chart(c,{type,data,options:{responsive:true,maintainAspectRatio:false,...opts}});
}

    label:g,
    data:GRD[g],

  }));

  } else if(curCol!=="全部"){
    g1data=COL_GRD[curCol]["1年級"];
    g2data=COL_GRD[curCol]["2年級"];
    gradeColTitle=`${curCol}：1年級 vs 2年級`;
  } else {
    g1data=GRD["1年級"];
    g2data=GRD["2年級"];
    gradeColTitle="全校：1年級 vs 2年級";
  }

  document.getElementById("p1").innerHTML=`
<div class="card">
  <div class="ct">各系所 UCAN 整體平均 PR 值（${curCol==="全部"?"全校":curCol}${curGrd!=="全部"?` · ${curGrd}`:""}）</div>
  <div style="position:relative;height:${deptAvgs.length*30+46}px"><canvas id="dBar"></canvas></div>
  <div class="leg">${COLS.map(c=>`<span><i style="background:${CCOL[c]}"></i>${c}</span>`).join("")}</div>
</div>
<div class="g2">
  <div class="card">
    <div class="ct">${lbl} vs ${curGrd!=="全部"?`全校${curGrd}`:"全校平均"}（雷達）</div>
    <div style="position:relative;height:300px"><canvas id="rComp"></canvas></div>
  </div>
  <div class="card">
    <div class="ct">${showDiff?lbl+" 與全校差異":"（請選擇學院、系所或年級以顯示差異）"}</div>
    ${showDiff
      ?`<div style="position:relative;height:${diffRows.length*26+40}px"><canvas id="diffBar"></canvas></div>`
      :`<div style="height:100px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:13px;">請選擇學院、系所或年級</div>`}
  </div>
</div>
<div class="g2">
  <div class="card">
    <div class="ct">各學院 1年級 vs 2年級 雷達比較</div>
    <div style="position:relative;height:300px"><canvas id="radGrdCol"></canvas></div>
    <div class="leg">${COLS.map(c=>`<span><i style="background:${CCOL[c]}"></i>${c}</span>`).join("")}</div>
  </div>
  <div class="card">
    <div class="ct">${gradeColTitle}</div>
    <div style="position:relative;height:300px"><canvas id="radGrd2"></canvas></div>
    <div class="leg">
      <span><i style="background:${GCOL["1年級"]}"></i>1年級</span>
      <span><i style="background:${GCOL["2年級"]}"></i>2年級</span>
    </div>
  </div>
</div>`;

  // 系所橫向長條
  mk("dBar","bar",{
    labels:deptAvgs.map(d=>d.name),
    datasets:[{label:"整體平均PR",data:deptAvgs.map(d=>d.v),backgroundColor:deptAvgs.map(d=>CCOL[d.col]||"#2D8A5F"),borderRadius:3}]
  },{indexAxis:"y",scales:{x:{min:30,max:60,ticks:{font:{size:10}},grid:{color:"#eee"}},y:{ticks:{font:{size:10}},grid:{display:false}}},
     plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>` 整體平均PR：${Number(i.raw).toFixed(1)}`}}}});

  // 比較雷達（選定 vs 全校）
  mk("rComp","radar",{
    labels:CN,
    datasets:[
      {label:lbl,data:pr,borderColor:"#c8a64b",backgroundColor:"rgba(201,162,39,0.18)",borderWidth:2,pointRadius:2},
      {label:curGrd!=="全部"?`全校${curGrd}`:"全校平均",data:refPR,borderColor:"#0a5a2e",backgroundColor:"rgba(0,107,63,0.12)",borderWidth:1.5,pointRadius:2}
    ]
  },{scales:{r:{min:0,max:80,ticks:{font:{size:7},stepSize:20},pointLabels:{font:{size:8}}}},
     plugins:{legend:{display:true,position:"bottom",labels:{font:{size:10},boxWidth:9,padding:10}}}});

  // 差異長條
  if(showDiff && diffRows.length){
    mk("diffBar","bar",{
      labels:diffRows.map(d=>d.n),
      datasets:[{label:"差異",data:diffRows.map(d=>d.diff),backgroundColor:diffRows.map(d=>d.diff>=0?"#0a5a2e":"#c0614e"),borderRadius:3}]
    },{indexAxis:"y",scales:{x:{min:-25,max:25,ticks:{font:{size:10},callback:v=>v>0?"+"+v:v},grid:{color:"#eee"}},y:{ticks:{font:{size:9}},grid:{display:false}}},
       plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>` ${Number(i.raw)>0?"+":""}${Number(i.raw).toFixed(1)}`}}}});
  }

  // 各學院 1年級 vs 2年級 疊加雷達（4學院各自用1色實線+虛線）
  const grdColDs=[];
  COLS.forEach(c=>{
    grdColDs.push({label:`${c} 1年級`,data:COL_GRD[c]["1年級"],borderColor:CCOL[c],backgroundColor:"transparent",borderWidth:2,pointRadius:1,borderDash:[]});
    grdColDs.push({label:`${c} 2年級`,data:COL_GRD[c]["2年級"],borderColor:CCOL[c],backgroundColor:"transparent",borderWidth:1.5,pointRadius:1,borderDash:[5,4]});
  });
  mk("radGrdCol","radar",{labels:CN,datasets:grdColDs},{
    scales:{r:{min:0,max:80,ticks:{font:{size:7},stepSize:20},pointLabels:{font:{size:8}}}},
    plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>` ${i.dataset.label}：${Number(i.raw).toFixed(1)}`}}}});

  // 選定學院（或全校）的 1年級 vs 2年級
  mk("radGrd2","radar",{
    labels:CN,
    datasets:[
      {label:"1年級",data:g1data,borderColor:GCOL["1年級"],backgroundColor:"rgba(0,107,63,0.18)",borderWidth:2,pointRadius:2},
      {label:"2年級",data:g2data,borderColor:GCOL["2年級"],backgroundColor:"rgba(201,162,39,0.18)",borderWidth:2,pointRadius:2}
    ]
  },{scales:{r:{min:0,max:80,ticks:{font:{size:7},stepSize:20},pointLabels:{font:{size:8}}}},
     plugins:{legend:{display:true,position:"bottom",labels:{font:{size:11},boxWidth:10,padding:10}}}});
}

// ══════════════════════════════════════════
// 頁 2 — 資料表
// ══════════════════════════════════════════
function drawP2(){
  const depts=curDep!=="全部"?[curDep]:deptsFor(curCol);
  let rows=[];
  depts.sort().forEach(d=>{
    CN.forEach((n,i)=>{
      if(curGrd!=="全部"){
        rows.push({yr:114,col:DEP[d].col,dep:d,grade:curGrd,ct:n,avgPR:DEP_GRD[d][curGrd][i]});
      } else {
        ["1年級","2年級"].forEach(g=>{
          rows.push({yr:114,col:DEP[d].col,dep:d,grade:g,ct:n,avgPR:DEP_GRD[d][g][i]});
        });
      }
    });
  });
  rows.sort((a,b)=>{
    if(sortK==="avgPR") return sortA?a.avgPR-b.avgPR:b.avgPR-a.avgPR;
    const va=String(a[sortK]), vb=String(b[sortK]);
    return sortA?va.localeCompare(vb,"zh-TW"):vb.localeCompare(va,"zh-TW");
  });

  document.getElementById("p2").innerHTML=`
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="ct" style="margin:0">篩選後彙整資料表</div>
    <button onclick="dlCSV()" style="font-size:12px;padding:5px 14px;background:var(--g);color:#fff;border:none;border-radius:6px;cursor:pointer">匯出 CSV</button>
  </div>
  <div style="overflow-x:auto;max-height:520px;overflow-y:auto">
    <table>
      <thead><tr>
        ${[["學年度","yr"],["學院","col"],["系所","dep"],["年級","grade"],["職涯類型","ct"],["平均 PR 值","avgPR"]].map(([l,k])=>
          `<th onclick="srt('${k}')">${l}${sortK===k?(sortA?" ▲":" ▼"):""}</th>`).join("")}
      </tr></thead>
      <tbody>${rows.map((r,idx)=>`
        <tr style="background:${idx%2===0?"#fff":"var(--lg)"}">
          <td>${r.yr}</td>
          <td style="color:${CCOL[r.col]||"var(--g)"};font-weight:600">${r.col}</td>
          <td>${r.dep}</td>
          <td style="color:${GCOL[r.grade]};font-weight:600">${r.grade}</td>
          <td>${r.ct}</td>
          <td style="font-weight:700;color:${r.avgPR>=50?"var(--gd)":"var(--g)"}">${r.avgPR.toFixed(1)}</td>
        </tr>`).join("")}
      </tbody>
    </table>
  </div>
  <div style="font-size:11px;color:#bbb;margin-top:8px">共 ${rows.length} 筆｜依系所、年級與職涯類型彙整，不含個別學生資料</div>
</div>`;
}

function srt(k){if(sortK===k){sortA=!sortA;}else{sortK=k;sortA=false;}drawP2();}
function dlCSV(){
  const depts=curDep!=="全部"?[curDep]:deptsFor(curCol);
  let r=[["學年度","學院","系所","年級","職涯類型","平均PR值"]];
  depts.sort().forEach(d=>{
    CN.forEach((n,i)=>{
      if(curGrd!=="全部"){
        r.push([114,DEP[d].col,d,curGrd,n,DEP_GRD[d][curGrd][i].toFixed(1)]);
      } else {
        ["1年級","2年級"].forEach(g=>r.push([114,DEP[d].col,d,g,n,DEP_GRD[d][g][i].toFixed(1)]));
      }
    });
  });
  const a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,\uFEFF"+encodeURIComponent(r.map(l=>l.join(",")).join("\n"));
  a.download="UCAN_職涯興趣.csv"; a.click();
}

// 初始化
drawP0();
</script>
</body>
</html>
