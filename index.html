<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NKUHT 校務公開資料儀表板</title>
  <meta name="description" content="國立高雄餐旅大學 校務公開資料儀表板 — 學生組成、就業力、師資、研究產學、財務、治理與永續(SDGs)的互動式戰情面板。">
  <meta name="theme-color" content="#0a5a2e">

  <link rel="icon" type="image/gif" href="assets/logo.gif">
  <link rel="apple-touch-icon" href="assets/logo.gif">

  <!-- 社群分享預覽（Open Graph / Twitter） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="國立高雄餐旅大學 NKUHT">
  <meta property="og:title" content="NKUHT 校務公開資料儀表板">
  <meta property="og:description" content="六年趨勢 × 八大指標：學生組成、就業力、師資、研究產學、財務、治理與永續(SDGs)的互動式戰情面板。">
  <meta property="og:url" content="https://nkuht-sdir-dashboard.pages.dev/">
  <meta property="og:image" content="https://nkuht-sdir-dashboard.pages.dev/assets/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NKUHT 校務公開資料儀表板">
  <meta name="twitter:description" content="六年趨勢 × 八大指標的互動式校務戰情面板。">
  <meta name="twitter:image" content="https://nkuht-sdir-dashboard.pages.dev/assets/og-image.svg">

  <!-- 字型改用 Google Fonts CDN（原版內嵌 220 個 woff2 子集，已移除） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/styles.css">

  <style>
    /* 載入開場：校徽柔和浮現，React 掛載後緩慢淡出（避免白畫面閃爍） */
    #__splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: linear-gradient(180deg, #08471f, #0a5a2e);
      transition: opacity .9s ease; opacity: 1;
    }
    #__splash.hide { opacity: 0; pointer-events: none; }
    #__splash .logo-card {
      width: 132px; height: 132px; border-radius: 26px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 16px 44px rgba(0,0,0,.28);
      animation: __logoIn 1s cubic-bezier(.22,.61,.36,1) both, __logoFloat 3.4s ease-in-out 1s infinite;
    }
    #__splash .logo-card img { width: 88px; height: auto; display: block; }
    #__splash .title { color: #e8d27a; font-family: "Noto Sans TC",sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 3px;
      animation: __fadeUp 1s ease .25s both; }
    #__splash .bar { width: 170px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden;
      animation: __fadeUp 1s ease .45s both; }
    #__splash .bar::before { content: ""; display: block; height: 100%; width: 35%; border-radius: 3px;
      background: linear-gradient(90deg, transparent, #e8d27a, transparent); animation: __loadbar 2s ease-in-out infinite; }
    @keyframes __logoIn { from { opacity: 0; transform: scale(.78); } to { opacity: 1; transform: scale(1); } }
    @keyframes __logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes __fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes __loadbar { 0% { transform: translateX(-120%); } 100% { transform: translateX(420%); } }
    @media (prefers-reduced-motion: reduce) {
      #__splash .logo-card, #__splash .title, #__splash .bar { animation: none; opacity: 1; }
      #__splash .bar::before { animation: none; width: 100%; }
    }
  </style>

  <script>
    // 在 React 載入前先套用已儲存的主題，避免亮→暗閃爍
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem("nkuht-tweaks") || "null");
        var theme = t && t.theme ? t.theme
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="__splash">
    <div class="logo-card"><img src="assets/logo.gif" alt="國立高雄餐旅大學 校徽" width="88"></div>
    <div class="title">校務公開資料儀表板</div>
    <div class="bar"></div>
  </div>
  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a5a2e;color:#e8d27a;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px;">
      本儀表板需要啟用 JavaScript 才能顯示。<br>This dashboard requires JavaScript to display.
    </div>
  </noscript>

  <div id="root"></div>

  <!-- React 18.3.1（production UMD，本機 vendored） -->
  <script src="assets/vendor/react.production.min.js"></script>
  <script src="assets/vendor/react-dom.production.min.js"></script>

  <!-- 資料層（全域：window.NKUHT_DATA / NKUHT_DATA_X / NKUHT_UTIL / NKUHT_UNIT） -->
  <script src="assets/data/dataset.js"></script>
  <script src="assets/data/aggregated.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/unit-filter.js"></script>

  <!-- 應用程式元件（JSX 已於建置期以 Babel react+env 預先編譯為一般 JS） -->
  <script src="assets/js/components.js"></script>
  <script src="assets/js/charts-ext.js"></script>
  <script src="assets/js/visual-ext.js"></script>
  <script src="assets/js/modules.js"></script>
  <script src="assets/js/modules-ext.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    // 進場動畫保底：正常瀏覽器 0.5s 內就播完並停在完全顯示，此保底為 no-op；
    // 萬一動畫未推進（極少數環境），掛載 1.8 秒後強制關閉動畫使內容必定可見。
    // 透過 MutationObserver 涵蓋初次載入與每次切分頁/重繪新掛載的區塊。
    (function () {
      var SEL = ".section, .module-hero, .sdg-hero, .kpi-wall";
      function settle() {
        var els = document.querySelectorAll(SEL);
        for (var i = 0; i < els.length; i++) {
          if (parseFloat(getComputedStyle(els[i]).opacity) < 0.99) els[i].style.animation = "none";
        }
      }
      var t;
      function schedule() { clearTimeout(t); t = setTimeout(settle, 1800); }
      schedule();
      var root = document.getElementById("root");
      if (root) {
        new MutationObserver(function (muts) {
          for (var i = 0; i < muts.length; i++) {
            if (muts[i].addedNodes.length) { schedule(); break; }
          }
        }).observe(root, { childList: true, subtree: true });
      }
    })();
  </script>

  <script>
    // 開場畫面至少顯示一段時間（讓校徽動畫看得清楚、不再像故障快閃），
    // React 掛載後再緩慢淡出（淡出 .9s）。最多等 5 秒保底。
    (function () {
      var splash = document.getElementById("__splash");
      if (!splash) return;
      var MIN_MS = 1400;            // 最短展示時間
      var start = performance.now ? performance.now() : Date.now();
      var done = false;
      function fadeOut() {
        if (done) return;
        done = true;
        splash.classList.add("hide");
        setTimeout(function () { if (splash.parentNode) splash.remove(); }, 950);
      }
      function maybeHide() {
        var elapsed = (performance.now ? performance.now() : Date.now()) - start;
        var ready = (root && root.children.length) || waited >= 5000;
        if (!ready) return false;
        // 內容好了但還沒到最短展示時間 → 等補足再淡出
        if (elapsed < MIN_MS) { setTimeout(fadeOut, MIN_MS - elapsed); }
        else { fadeOut(); }
        return true;
      }
      var root = document.getElementById("root");
      var waited = 0;
      var timer = setInterval(function () {
        waited += 60;
        if (maybeHide()) clearInterval(timer);
      }, 60);
    })();
  </script>
</body>
</html>
